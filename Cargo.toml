[package]
name = "libens"
version = "0.0.1"
edition = "2021"
rust-version = "1.82"
license = "UNLICENSED"
publish = false
authors = ["LLT TCP team"]

[workspace]
members = [
    ".",
    "cli",
    "crates/ens-core",
    "crates/ens-stub",
]

[lib]
crate-type = ["cdylib"]
name = "ens"

[dependencies]
ens-core = { path = "crates/ens-core" }
uniffi = { version = "0.28.3" }

[target.'cfg(target_os = "android")'.dependencies]
rustls-platform-verifier = "0.6"
jni = "0.21"
log = { version = "0.4", features = ["std"] }

[build-dependencies]
winresource = "0.1.31"
uniffi = { version = "0.28.3", features = ["build"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = "full"

[profile.release.package.ens-cli]
strip = "symbols"

[package.metadata.winresource]
CompanyName = "Nord Security"
LegalCopyright = "Nord Security"

[lints.clippy]
empty-line-after-doc-comments = "allow"
