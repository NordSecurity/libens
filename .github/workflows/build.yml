name: Build
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target_os: windows
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            linking: static
          - arch: x86_64
            target_os: windows
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            linking: dynamic
          - arch: aarch64
            target_os: windows
            runner: windows-2022
            target: aarch64-pc-windows-msvc
            linking: static
          - arch: aarch64
            target_os: windows
            runner: windows-2022
            target: aarch64-pc-windows-msvc
            linking: dynamic
          - arch: x86_64
            target_os: linux
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            linking: default
          - arch: aarch64
            target_os: linux
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            linking: default
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "35.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target_os }}-${{ matrix.arch }}-${{ matrix.linking }}
      - name: Setup MSVC
        uses: egor-tensin/vs-shell@54e4148eac794e4580591c2e0b7750f14b7891fc # v2.2
        if: ${{ matrix.target_os == 'windows' }}
      - name: Configure Windows RUSTFLAGS (CFG + CRT linking)
        if: ${{ matrix.target_os == 'windows' }}
        shell: bash
        run: |
          if [ "${{ matrix.linking }}" = "static" ]; then
            CRT_FLAG="+crt-static"
          else
            CRT_FLAG="-crt-static"
          fi
          echo "RUSTFLAGS=-C control-flow-guard -C target-feature=$CRT_FLAG $RUSTFLAGS" >> $GITHUB_ENV
      - name: Build libens
        run: cargo build --release --target ${{ matrix.target }} --lib
      - name: Upload shared library
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: libens-${{ matrix.target_os }}-${{ matrix.arch }}-${{ matrix.linking }}
          path: |
            target/${{ matrix.target }}/release/libens.dylib
            target/${{ matrix.target }}/release/libens.so
            target/${{ matrix.target }}/release/ens.dll
          if-no-files-found: error

  build-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target_os: windows
            runner: windows-2022
            target: x86_64-pc-windows-msvc
          - arch: aarch64
            target_os: windows
            runner: windows-2022
            target: aarch64-pc-windows-msvc
          - arch: x86_64
            target_os: linux
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            target_os: linux
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "35.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: cli-${{ matrix.target_os }}-${{ matrix.arch }}
      - name: Setup MSVC
        uses: egor-tensin/vs-shell@54e4148eac794e4580591c2e0b7750f14b7891fc # v2.2
        if: ${{ matrix.target_os == 'windows' }}
      - name: Build ens-cli
        run: cargo build --release --target ${{ matrix.target }} -p ens-cli
      - name: Upload ens-cli
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ens-cli-${{ matrix.target_os }}-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/ens-cli
            target/${{ matrix.target }}/release/ens-cli.exe
          if-no-files-found: error
