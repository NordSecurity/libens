[package]
name = "ens-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
ens = { package = "ens-core", path = "../crates/ens-core" }
log = "0.4.34"
reqwest = { version = "0.13.5", features = ["gzip", "json"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs"] }
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["net"] }
tokio-rustls = { version = "0.26.6", default-features = false }
tracing = { version = "0.1.44", features = ["log"] }

