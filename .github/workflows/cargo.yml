name: cargo

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NIGHTLY_VERSION: "nightly-2025-12-01"

permissions:
  contents: read
  packages: read

jobs:
  cargo-fmt:
    name: cargo fmt
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/nordsecurity/build-linux-rust1.97.1:v8.0.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: rustup component add rustfmt
      - run: cargo fmt -- --check --color always

  cargo-clippy:
    name: cargo clippy
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/nordsecurity/build-linux-rust1.97.1:v8.0.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: rustup component add clippy
      - run: cargo clippy --all-targets --all-features --color always -- --deny warnings

  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/nordsecurity/build-linux-rust1.97.1:v8.0.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: cargo install --locked cargo-deny@0.20.2
      - run: cargo deny check

  cargo-udeps:
    name: cargo udeps
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/nordsecurity/build-linux-rust1.97.1:v8.0.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: rustup toolchain add ${{ env.NIGHTLY_VERSION }}
      - run: cargo +${{ env.NIGHTLY_VERSION }} install cargo-udeps@0.1.61 --locked
      - run: cargo +${{ env.NIGHTLY_VERSION }} udeps --workspace --locked --output human --backend depinfo

  cargo-test-linux:
    name: cargo test (linux)
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/nordsecurity/build-linux-rust1.97.1:v8.0.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: cargo build --all
      - run: cargo test --all --all-features -- --nocapture

  cargo-test-windows:
    name: cargo test (windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "35.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo build --all
      - run: cargo test --all --all-features -- --nocapture
