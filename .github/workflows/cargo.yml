name: cargo

on: [push, pull_request]

concurrency:
  # This prevents cancelation in case of two merges to main that are close to
  # each other and will have jobs running at the same time
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: debug
  NIGHTLY_VERSION: "nightly-2025-12-01"
  COVERAGE_DIR: coverage
  COVERAGE_ARGS: --all --all-features --exclude ens-cli --exclude ens-stub --ignore-filename-regex ens-core/src/test_support
  ECH_STUB_DIR: crates/ens-core/tests/echstub

permissions:
  contents: read
  packages: read

jobs:
  cargo-fmt:
    name: cargo fmt
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/nordsecurity/build-linux-rust1.97.1:v8.0.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: rustup component add rustfmt
      - run: cargo fmt -- --check --color always

  cargo-clippy:
    name: cargo clippy
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/nordsecurity/build-linux-rust1.97.1:v8.0.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: clippy-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets --all-features --color always --package libens --package ens-core --package ens-stub -- --deny warnings

  cargo-deny:
    name: cargo deny
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/nordsecurity/build-linux-rust1.97.1:v8.0.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: deny-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo install --locked cargo-deny@0.20.2
      - run: cargo deny check

  cargo-udeps:
    name: cargo udeps
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/nordsecurity/build-linux-rust1.97.1:v8.0.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: rustup toolchain add ${{ env.NIGHTLY_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: udeps-linux-${{ env.NIGHTLY_VERSION }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo +${{ env.NIGHTLY_VERSION }} install cargo-udeps@0.1.61 --locked
      - run: cargo +${{ env.NIGHTLY_VERSION }} udeps --workspace --locked --output human --backend depinfo

  cargo-llvm-cov:
    name: cargo llvm-cov
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-26.04
    outputs:
      lines: ${{ steps.summary.outputs.lines }}
    container:
      image: ghcr.io/nordsecurity/build-linux-rust1.97.1:v8.0.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.ECH_STUB_DIR }}/go.mod
          cache: false
      - name: Warm up Go build cache
        run: go build -buildvcs=false -o ${{ runner.temp }}/echstub .
        working-directory: ${{ env.ECH_STUB_DIR }}
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: llvm-cov-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo install --locked cargo-llvm-cov@0.9.1
      - name: Compute coverage from unit and integration tests
        run: cargo llvm-cov ${{ env.COVERAGE_ARGS }} --html --output-dir ${{ env.COVERAGE_DIR }} -- --test-threads 30
      - name: Print coverage summary
        id: summary
        run: |
          cargo llvm-cov ${{ env.COVERAGE_ARGS }} --no-run | tee "$RUNNER_TEMP/summary.txt"
          {
            echo '## Coverage'
            echo '```'
            cat "$RUNNER_TEMP/summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          awk '$1 == "TOTAL" { print "::notice title=Coverage::lines " $10 ", regions " $4 ", functions " $7 }' "$RUNNER_TEMP/summary.txt"
          awk '$1 == "TOTAL" { print "lines=" $10 }' "$RUNNER_TEMP/summary.txt" >> "$GITHUB_OUTPUT"
      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-html
          path: ${{ env.COVERAGE_DIR }}/html
          if-no-files-found: error

  coverage-total:
    name: total coverage ${{ needs.cargo-llvm-cov.outputs.lines }}
    needs: cargo-llvm-cov
    runs-on: ubuntu-26.04
    steps:
      - run: echo "${{ needs.cargo-llvm-cov.outputs.lines }}"

  cargo-test-linux:
    name: cargo test (linux)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/nordsecurity/build-linux-rust1.97.1:v8.0.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.ECH_STUB_DIR }}/go.mod
          cache: false
      - name: Warm up Go build cache
        run: go build -buildvcs=false -o ${{ runner.temp }}/echstub .
        working-directory: ${{ env.ECH_STUB_DIR }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: test-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --all
      - run: cargo test --all --all-features -- --test-threads 30

  cargo-test-release:
    name: cargo test (release)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/nordsecurity/build-linux-rust1.97.1:v8.0.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.ECH_STUB_DIR }}/go.mod
          cache: false
      - name: Warm up Go build cache
        run: go build -buildvcs=false -o ${{ runner.temp }}/echstub .
        working-directory: ${{ env.ECH_STUB_DIR }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: test-release-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release --all
      - run: cargo test --release --all --all-features -- --test-threads 30

  cargo-test-windows:
    name: cargo test (windows)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.ECH_STUB_DIR }}/go.mod
          cache: false
      - name: Warm up Go build cache
        run: go build -buildvcs=false -o ${{ runner.temp }}/echstub .
        working-directory: ${{ env.ECH_STUB_DIR }}
      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "35.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: test-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --all
      - run: cargo test --all --all-features -- --test-threads 30
