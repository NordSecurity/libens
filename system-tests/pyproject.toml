[project]
name = "libens-system-tests"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiohttp==3.12.14",
    "cryptography==45.0.5",
    "pyro5==5.15",
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-html==4.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
log_level = "INFO"
log_format = "%(asctime)s.%(msecs)03d %(levelname)s %(name)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"

[dependency-groups]
dev = [
    "black==25.1.0",
    "mypy==1.17.1",
    "ruff==0.12.7",
]

[tool.black]
target-version = ["py311"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "PL"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_incomplete_defs = true
