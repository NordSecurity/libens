name: cargo

on: [push, pull_request]

concurrency:
  # This prevents cancelation in case of two merges to main that are close to
  # each other and will have jobs running at the same time
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NIGHTLY_VERSION: "nightly-2025-12-01"

permissions:
  contents: read
  packages: read

jobs:
  cargo-fmt:
    name: cargo fmt
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/nordsecurity/build-linux-rust1.97.1:v8.0.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: rustup component add rustfmt
      - run: cargo fmt -- --check --color always

  cargo-clippy:
    name: cargo clippy
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/nordsecurity/build-linux-rust1.97.1:v8.0.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: clippy-linux
      - run: cargo clippy --all-targets --all-features --color always --package libens --package ens-core -- --deny warnings

  cargo-deny:
    name: cargo deny
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/nordsecurity/build-linux-rust1.97.1:v8.0.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: deny-linux
      - run: cargo install --locked cargo-deny@0.20.2
      - run: cargo deny check

  cargo-udeps:
    name: cargo udeps
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/nordsecurity/build-linux-rust1.97.1:v8.0.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: rustup toolchain add ${{ env.NIGHTLY_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: udeps-linux-${{ env.NIGHTLY_VERSION }}
      - run: cargo +${{ env.NIGHTLY_VERSION }} install cargo-udeps@0.1.61 --locked
      - run: cargo +${{ env.NIGHTLY_VERSION }} udeps --workspace --locked --output human --backend depinfo

  cargo-test-linux:
    name: cargo test (linux)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/nordsecurity/build-linux-rust1.97.1:v8.0.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: test-linux
      - run: cargo build --all
      - run: cargo test --all --all-features -- --nocapture --test-threads 30

  cargo-test-windows:
    name: cargo test (windows)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "35.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: test-windows
      - run: cargo build --all
      - run: cargo test --all --all-features -- --nocapture --test-threads 30
