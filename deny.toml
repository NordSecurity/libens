
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "all"
yanked = "warn"
ignore = [
    "RUSTSEC-2024-0436", # paste is unmaintained
    "RUSTSEC-2025-0141", # bincode is unmaintained
]

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib"
]

confidence-threshold = 0.8
exceptions = [
    { allow = ["GPL-3.0-only"], name = "llt-proto", version = "*" },
]

[licenses.private]
ignore = true
registries = []

[graph]
exclude-dev = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []


[sources]
unknown-registry = "warn"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[sources.allow-org]
github = ["NordSecurity"]
gitlab = []
bitbucket = []

