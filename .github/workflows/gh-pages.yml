name: gh-pages
run-name: ${{ github.actor }} is deploying rustdoc from main to GitHub Pages

on: [workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  DOC_DIR: target/doc
  GUIDE_PATH: ens/integration_guide/

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/nordsecurity/build-linux-rust1.97.1:v8.0.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}${{ env.GUIDE_PATH }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: cargo doc --no-deps --package libens
        env:
          RUSTDOCFLAGS: --deny warnings
      - name: Redirect site root to the integration guide
        run: echo "<meta http-equiv=\"refresh\" content=\"0; url=${GUIDE_PATH}\">" > "${DOC_DIR}/index.html"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.DOC_DIR }}
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
